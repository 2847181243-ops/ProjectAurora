name: krkr-sim-engine

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/krkr-sim'

jobs:
  engine:
    name: KiriKiri2 engine for the iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: clone the engine
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/reAAAq/KrKr2-Next third_party/krkr

      - name: install build tools
        run: |
          set -euo pipefail
          brew install ninja autoconf automake autoconf-archive libtool pkg-config bison flex || true
          echo "BISON_BIN=$(brew --prefix bison)/bin" >> "$GITHUB_ENV"

      - name: prepare vcpkg
        run: |
          set -euo pipefail
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -x "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            git clone --depth 1 https://github.com/microsoft/vcpkg third_party/vcpkg
            third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
            echo "VCPKG_ROOT=$PWD/third_party/vcpkg" >> "$GITHUB_ENV"
          fi
          echo "VCPKG_BINARY_SOURCES=clear;files,$PWD/krkr-sim-vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          mkdir -p krkr-sim-vcpkg-cache

      - uses: actions/cache@v4
        with:
          path: krkr-sim-vcpkg-cache
          key: krkrsim-vcpkg-${{ runner.os }}-${{ github.sha }}
          restore-keys: krkrsim-vcpkg-${{ runner.os }}-

      - name: patch out the proprietary Live2D SDK
        run: |
          set -euo pipefail
          F=third_party/krkr/cpp/plugins/CMakeLists.txt
          python3 - "$F" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          # The Cubism SDK is proprietary and absent here; upstream still creates the
          # target unconditionally, which fails on an empty source glob. Make it an
          # interface target and downgrade every per-target property to INTERFACE.
          text = text.replace('add_library(CubismFramework STATIC ${CUBISM_FW_SOURCES})',
                              'add_library(CubismFramework INTERFACE)')
          text = re.sub(
              r'(target_(?:sources|include_directories|compile_definitions|compile_options|link_options|link_directories|link_libraries)\(\s*CubismFramework\s+)(PUBLIC|PRIVATE)',
              r'\1INTERFACE', text)
          # Without the SDK the feature flag must go too, or krkrgles.cpp and
          # engine_api.cpp still compile Live2D paths that reference missing symbols.
          text = re.sub(r'^\s*target_compile_definitions\(\$\{PROJECT_NAME\} PUBLIC KRKR2_LIVE2D\)\s*$',
                        '', text, flags=re.M)
          open(path, 'w', encoding='utf-8').write(text)
          print('patched CubismFramework into an interface target')
          PY
          grep -n 'CubismFramework\|KRKR2_LIVE2D' "$F" | head -12
          # Drop the Live2D plugin translation unit everywhere it is listed.
          # These paths are inside the cloned tree, not the workspace root.
          for f in $(grep -rl 'krkrlive2d\.cpp' third_party/krkr/cpp --include=CMakeLists.txt); do
            sed -i '' '/krkrlive2d\.cpp/d' "$f"
            echo "removed krkrlive2d.cpp from $f"
          done
          rm -f third_party/krkr/cpp/plugins/krkrlive2d.cpp
          test ! -e third_party/krkr/cpp/plugins/krkrlive2d.cpp && echo "deleted krkrlive2d.cpp"

      - name: define the simulator triplet
        run: |
          set -euo pipefail
          T=third_party/krkr/vcpkg/triplets/arm64-iphonesimulator.cmake
          sed 's/^set(VCPKG_OSX_SYSROOT.*/set(VCPKG_OSX_SYSROOT iphonesimulator)/' \
            third_party/krkr/vcpkg/triplets/arm64-ios.cmake > "$T"
          # The upstream triplet never sets VCPKG_OSX_SYSROOT, so the sed above is a
          # no-op: vcpkg would keep building for the device sysroot. Append it.
          echo 'set(VCPKG_OSX_SYSROOT iphonesimulator)' >> "$T"
          # glib calls pipe2(), which the simulator SDK only declares with the full
          # Darwin feature set; without this every glib build fails on gbacktrace.c.
          echo 'set(VCPKG_C_FLAGS "-D_DARWIN_C_SOURCE")' >> "$T"
          echo 'set(VCPKG_CXX_FLAGS "-D_DARWIN_C_SOURCE")' >> "$T"
          cat "$T"

      - name: teach glib that Darwin has no pipe2 header
        run: |
          set -euo pipefail
          P=third_party/krkr/vcpkg/ports/glib/portfile.cmake
          python3 - "$P" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          key = 'vcpkg_extract_source_archive'
          i = text.find(key)
          if i < 0:
              raise SystemExit('no extraction call in the glib portfile')
          j = text.index('(', i)
          depth = 0
          k = j
          while k < len(text):
              if text[k] == '(':
                  depth += 1
              elif text[k] == ')':
                  depth -= 1
                  if depth == 0:
                      break
              k += 1
          inject = '''
          # Aurora: on Darwin pipe2() is only declared with the full feature set, and
          # glib's include order hides it. Force the portable fallback path instead of
          # failing the simulator build on an implicit declaration.
          file(READ "${SOURCE_PATH}/glib/glib-unixprivate.h" _aurora_gup)
          string(REPLACE "#ifdef HAVE_PIPE2" "#if 0" _aurora_gup "${_aurora_gup}")
          string(REPLACE "#if defined(HAVE_PIPE2)" "#if 0" _aurora_gup "${_aurora_gup}")
          file(WRITE "${SOURCE_PATH}/glib/glib-unixprivate.h" "${_aurora_gup}")
          '''
          text = text[:k + 1] + '\n' + inject + text[k + 1:]
          open(path, 'w', encoding='utf-8').write(text)
          print('patched the glib port after the extraction call')
          PY
          sed -n '18,32p' "$P"
      - name: mount the project's own xp3 archives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          fn = pathlib.Path('patches/krkr-project-xp3.inc').read_text()
          decl = 'void TVPAutoMountProjectXP3Archives();'
          call = 'TVPAutoMountProjectXP3Archives();'

          # 1. declaration next to the sibling one
          h = pathlib.Path('third_party/krkr/cpp/core/base/StorageIntf.h')
          ht = h.read_text()
          if decl not in ht:
              ht = ht.replace('void TVPAutoMountSiblingXP3Archives();',
                              'void TVPAutoMountSiblingXP3Archives();\n' + decl)
              h.write_text(ht)

          # 2. definition after the sibling function, found by brace matching
          s = pathlib.Path('third_party/krkr/cpp/core/base/impl/StorageImpl.cpp')
          st = s.read_text()
          if 'TVPAutoMountProjectXP3Archives()' not in st:
              i = st.index('void TVPAutoMountSiblingXP3Archives()')
              j = st.index('{', i)
              depth = 0
              k = j
              while k < len(st):
                  if st[k] == '{': depth += 1
                  elif st[k] == '}':
                      depth -= 1
                      if depth == 0: break
                  k += 1
              st = st[:k + 1] + '\n\n' + fn + st[k + 1:]
              s.write_text(st)

          # 3. call right after the sibling mount
          a = pathlib.Path('third_party/krkr/cpp/core/environ/Application.cpp')
          at = a.read_text()
          if call not in at:
              at = at.replace('TVPAutoMountSiblingXP3Archives();',
                              'TVPAutoMountSiblingXP3Archives();\n\t' + call, 1)
              a.write_text(at)

          print('project xp3 mount wired')
          PY
          grep -n 'TVPAutoMountProjectXP3Archives' third_party/krkr/cpp/core/base/StorageIntf.h third_party/krkr/cpp/core/environ/Application.cpp | head -4
      - name: probe every executed script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('third_party/krkr/cpp/core/base/ScriptMgnIntf.cpp')
          s = p.read_text()
          anchor = 'bool isbytecode = TVPScriptEngine->LoadByteCode('
          if '[aurora] script ' not in s:
              probe = '''
                  {
                      tjs_uint64 azure_sz = stream->GetSize();
                      unsigned char azure_head[8] = {0};
                      stream->Read(azure_head, sizeof(azure_head));
                      stream->Seek(0);
                      spdlog::info("[aurora] script {} size={} head={:02x}{:02x}{:02x}{:02x}{:02x}{:02x}{:02x}{:02x}",
                                   place.AsStdString(), (long long)azure_sz, azure_head[0], azure_head[1],
                                   azure_head[2], azure_head[3], azure_head[4], azure_head[5],
                                   azure_head[6], azure_head[7]);
                  }
          '''
              s = s.replace(anchor, probe + anchor, 1)
              p.write_text(s)
              print('stream probe inserted')
          else:
              print('stream probe already present')
          PY
          grep -n 'aurora\] script' third_party/krkr/cpp/core/base/ScriptMgnIntf.cpp | head -2
      - name: configure for the simulator
        continue-on-error: true
        run: |
          set -o pipefail
          cd third_party/krkr
          BISON_EXEC="$(brew --prefix bison)/bin/bison"
          /usr/bin/time -p cmake -S . -B out/ios/sim -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DVCPKG_TARGET_TRIPLET=arm64-iphonesimulator \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DBUILD_TOOLS=OFF -DENABLE_TESTS=OFF \
            -DBISON_EXECUTABLE="$BISON_EXEC" \
            > ../../krkr-sim-configure.log 2>&1 || true
          tail -12 ../../krkr-sim-configure.log

      - name: build for the simulator
        continue-on-error: true
        run: |
          set -o pipefail
          cd third_party/krkr
          /usr/bin/time -p cmake --build out/ios/sim --target engine_api -j 6 > ../../krkr-sim-build.log 2>&1 || true
          tail -8 ../../krkr-sim-build.log

      - name: merge the simulator libraries
        if: always()
        run: |
          set +e
          OUT=third_party/krkr/out/ios/sim
          # Only archives whose objects target the simulator may be merged: one device
          # object makes the whole archive unusable for a simulator link.
          GOOD=""
          for a in $(find "$OUT" -name '*.a' | sort); do
            plat=$(otool -l "$a" 2>/dev/null | grep -A3 'LC_BUILD_VERSION' | grep ' platform ' | head -1 | awk '{print $2}')
            case "$plat" in
              7|"") GOOD="$GOOD $a" ;;   # 7 = iOS simulator, empty = no build version
              *) echo "skipping $a (platform $plat)" ;;
            esac
          done
          echo "merging $(echo $GOOD | wc -w) archives"
          libtool -static -o libkrkrell-sim.a $GOOD > merge.log 2>&1
          tail -5 merge.log
          ls -la libkrkrell-sim.a

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krkr-ios-sim-engine
          path: |
            libkrkrell-sim.a
            third_party/krkr/bridge/engine_api/include/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krkr-sim-logs
          path: |
            krkr-sim-configure.log
            krkr-sim-build.log
            merge.log
          if-no-files-found: warn

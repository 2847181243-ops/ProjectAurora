name: ons-sim

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/ons-sim'

jobs:
  ons-sim:
    name: ONScripter for the iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: build the stack
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 -b SDL2 https://github.com/libsdl-org/SDL third_party/SDL
          git clone --depth 1 https://github.com/libsdl-org/sdl12-compat third_party/sdl12-compat
          git clone --depth 1 --recurse-submodules --shallow-submodules -b SDL2 https://github.com/libsdl-org/SDL_image third_party/SDL_image
          git clone --depth 1 --recurse-submodules --shallow-submodules -b SDL2 https://github.com/libsdl-org/SDL_ttf third_party/SDL_ttf
          git clone --depth 1 --recurse-submodules --shallow-submodules -b SDL2 https://github.com/libsdl-org/SDL_mixer third_party/SDL_mixer

          COMMON="-G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=$PWD/prefix"

          cmake -S third_party/SDL -B b/sdl $COMMON -DSDL_SHARED=ON -DSDL_STATIC=ON -DSDL_FRAMEWORK=OFF -DSDL_TESTS=OFF -DSDL_INSTALL=ON -DSDL_OPENGL=OFF -DSDL_OPENGLES=ON > stack.log 2>&1
          cmake --build b/sdl --config Release --target install >> stack.log 2>&1

          cp Modules/ONScripter/sdl12_gl_stub.h .
          sed -i '' 's/^if(APPLE)$/if(APPLE AND NOT IOS)/' third_party/sdl12-compat/CMakeLists.txt
          sed -i '' 's/add_library(SDL SHARED/add_library(SDL STATIC/' third_party/sdl12-compat/CMakeLists.txt
          cmake -S third_party/sdl12-compat -B b/compat $COMMON -DCMAKE_PREFIX_PATH=$PWD/prefix -DSDL2_DIR=$PWD/prefix/lib/cmake/SDL2 -DSDL12TESTS=OFF -DSDL12DEVEL=ON "-DCMAKE_C_FLAGS=-include$PWD/sdl12_gl_stub.h" >> stack.log 2>&1
          cmake --build b/compat --config Release --target install >> stack.log 2>&1

          git clone --depth 1 https://github.com/pnggroup/libpng third_party/libpng
          git clone --depth 1 https://github.com/freetype/freetype third_party/freetype
          git clone --depth 1 https://github.com/xiph/ogg third_party/ogg
          git clone --depth 1 https://github.com/xiph/vorbis third_party/vorbis

          SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          cmake -S third_party/libpng -B b/png $COMMON -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DZLIB_INCLUDE_DIR=$SDKROOT/usr/include -DZLIB_LIBRARY=$SDKROOT/usr/lib/libz.tbd >> stack.log 2>&1
          cmake --build b/png --config Release --target install >> stack.log 2>&1
          cmake -S third_party/freetype -B b/ft $COMMON -DFT_DISABLE_PNG=ON -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_HVF=ON >> stack.log 2>&1
          cmake --build b/ft --config Release --target install >> stack.log 2>&1
          cmake -S third_party/ogg -B b/ogg $COMMON >> stack.log 2>&1
          cmake --build b/ogg --config Release --target install >> stack.log 2>&1
          cmake -S third_party/vorbis -B b/vorbis $COMMON -DOGG_INCLUDE_DIR=$PWD/prefix/include -DOGG_LIBRARY=$PWD/prefix/lib/libogg.a >> stack.log 2>&1
          cmake --build b/vorbis --config Release --target install >> stack.log 2>&1

          git clone --depth 1 -b SDL-1.2 https://github.com/libsdl-org/SDL_image third_party/SDL_image12
          git clone --depth 1 -b SDL-1.2 https://github.com/libsdl-org/SDL_ttf third_party/SDL_ttf12
          git clone --depth 1 -b SDL-1.2 https://github.com/libsdl-org/SDL_mixer third_party/SDL_mixer12
          git clone --depth 1 https://github.com/yeatse/ONScripter-iOS third_party/iosons
          git clone --depth 1 https://github.com/Galladite27/ONScripter-EN third_party/onscripter
          # The engine reports fatal errors with exit(-1); in an embedded app that
          # tears SDL down on the engine thread and trips a UIKit assertion. Turn
          # those calls into a throw the host can catch.
          python3 - third_party/onscripter/ScriptHandler.cpp <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          s = s.replace('if (!reporter) exit(-1); //nothing left to do without a way to report errors',
                        'if (!reporter) { fprintf(stderr, "[ons] fatal: %s\\n", str); throw 7101; }')
          s = s.replace('exit(-1);', 'throw 7101;')
          open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
          print('patched exit calls:', s.count('throw 7101'))
          PY

          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CC="clang -arch arm64 -mios-simulator-version-min=16.0 -isysroot $SDK -w -O2"
          CXX="clang++ -std=gnu++14 -arch arm64 -mios-simulator-version-min=16.0 -isysroot $SDK -w -Wno-c++11-narrowing"
          INC="-I Modules/ONScripter/smpeg -I prefix/include -I prefix/include/SDL -I third_party/iosons/SDL_image -I third_party/iosons/SDL_ttf -I third_party/iosons/SDL_mixer"
          mkdir -p obj obj/addons
          : > ons.log

          $CXX $INC -I Modules/ONScripter/src -c Modules/ONScripter/smpeg/aurora_smpeg.mm -o obj/aurora_smpeg.o >> ons.log 2>&1 || echo "FAILED: shim" >> ons.log

          IMG=third_party/SDL_image12
          sed -i '' '/{ "TIF"/d; /{ "XCF"/d; /{ "XV"/d; /{ "WEBP"/d; /{ "JPG"/d' "$IMG/IMG.c"
          for f in IMG IMG_xxx IMG_bmp IMG_gif IMG_lbm IMG_pcx IMG_png IMG_pnm IMG_tga IMG_xpm; do
            $CC $INC -I "$IMG" -DSDL_IMAGE_USE_COMMON_BACKEND -DLOAD_BMP -DLOAD_GIF -DLOAD_LBM -DLOAD_PCX -DLOAD_PNG -DLOAD_PNM -DLOAD_TGA -DLOAD_XPM -c "$IMG/$f.c" -o "obj/addons/$f.o" >> ons.log 2>&1 || echo "FAILED: image/$f" >> ons.log
          done
          $CC -c third_party/SDL_ttf12/SDL_ttf.c -I prefix/include/SDL -I prefix/include/freetype2 -o obj/addons/SDL_ttf.o >> ons.log 2>&1 || echo "FAILED: ttf" >> ons.log
          MIX=third_party/SDL_mixer12
          for f in mixer music wave load_aiff load_voc load_ogg music_ogg dynamic_ogg effects_internal effect_position effect_stereoreverse; do
            [ -f "$MIX/$f.c" ] || continue
            $CC $INC -I "$MIX" -DAIFF_MUSIC -DVOC_MUSIC -DOGG_MUSIC -DVORBIS_HEADER -c "$MIX/$f.c" -o "obj/addons/mix_$f.o" >> ons.log 2>&1 || echo "FAILED: mixer/$f" >> ons.log
          done

          for f in third_party/onscripter/*.cpp Modules/ONScripter/src/ons_engine_onscripter.cpp Modules/ONScripter/engine/ons_platform_symbols.cpp; do
            case "$(basename "$f")" in
              nscriptdecode.cpp|AVIWrapper.cpp|LUAHandler.cpp|MadWrapper.cpp|X11_messagebox.cpp) continue ;;
            esac
            $CXX $INC -I third_party/onscripter -I Modules/ONScripter/src -DSDL_MAIN_HANDLED -D_REENTRANT -DAURORA_WITH_ONSCRIPTER -c "$f" -o "obj/$(basename "${f%.cpp}").o" >> ons.log 2>&1 || echo "FAILED: $(basename "$f")" >> ons.log
          done

          cat > /tmp/jpg_stub.c <<'STUBS'
          #include <SDL.h>
          int IMG_isJPG(SDL_RWops *src) { (void)src; return 0; }
          SDL_Surface *IMG_LoadJPG_RW(SDL_RWops *src) { (void)src; return 0; }
          int IMG_InitJPG(void) { return 0; }
          void IMG_QuitJPG(void) {}
          STUBS
          $CC -I prefix/include/SDL -c /tmp/jpg_stub.c -o obj/addons/jpg_stub.o >> ons.log 2>&1 || echo "FAILED: jpg_stub" >> ons.log
          cat > /tmp/img_stubs.c <<'STUBS'
          int IMG_InitTIF(void) { return 0; }
          void IMG_QuitTIF(void) {}
          int IMG_InitWEBP(void) { return 0; }
          void IMG_QuitWEBP(void) {}
          STUBS
          $CC -c /tmp/img_stubs.c -o obj/addons/img_stubs.o >> ons.log 2>&1 || echo "FAILED: img_stubs" >> ons.log
          mkdir -p lib include/aurora-ons
          libtool -static -o prefix/lib/libSDL_image.a obj/addons/IMG*.o obj/addons/jpg_stub.o obj/addons/img_stubs.o
          libtool -static -o prefix/lib/libSDL_ttf.a obj/addons/SDL_ttf.o
          libtool -static -o prefix/lib/libSDL_mixer.a obj/addons/mix_*.o
          # The app link names -ljpeg; give it an empty archive instead of the library
          # we deliberately skipped on this SDK.
          echo 'void aurora_sim_jpeg_placeholder(void) {}' > /tmp/empty.c
          $CC -c /tmp/empty.c -o /tmp/empty.o >> ons.log 2>&1 || true
          libtool -static -o prefix/lib/libjpeg.a /tmp/empty.o
          libtool -static -o lib/libaurora_onscripter.a obj/*.o
          cp Modules/ONScripter/smpeg/*.h include/aurora-ons/ 2>/dev/null || true
          cp Modules/ONScripter/src/*.h include/aurora-ons/ 2>/dev/null || true
          grep -c "^FAILED" ons.log | tee -a ons.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-onscripter-sim
          path: |
            lib/libaurora_onscripter.a
            include/aurora-ons/
            prefix/include/
            prefix/lib/*.a
            prefix/lib/*.dylib
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ons-sim-logs
          path: |
            ons.log
            stack.log

      - name: publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/ons-sim-run${{ github.run_number }}.md"
          {
            echo "# ons-sim run ${{ github.run_number }}"
            echo ""
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ""
            echo "## compile summary"
            tail -3 ons.log 2>/dev/null
            echo ""
            echo "## stack tail"
            tail -5 stack.log 2>/dev/null
          } > "$file"
          git add "$file"
          git commit -m "ci: ons-sim run ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

  sim-run:
    name: run the app in the simulator
    needs: ons-sim
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aurora-onscripter-sim
          path: onslib

      - name: generate the module table
        continue-on-error: true
        run: |
          echo "--- onslib ---"
          ls onslib 2>/dev/null | head -10
          ls onslib/lib 2>/dev/null | head -10
          mkdir -p Applications/Aurora-iOS/Generated
          python3 BuildSystem/generate_builtin_table.py --out Applications/Aurora-iOS/Generated/AuroraBuiltinModules.cpp
          ls -la Applications/Aurora-iOS/Generated

      - name: build the app for the simulator
        continue-on-error: true
        run: |
          set -euo pipefail
          cd Applications/Aurora-iOS
          brew install xcodegen >/dev/null 2>&1 || true
          xcodegen generate > gen.log 2>&1
          xcodebuild -project Aurora.xcodeproj -scheme Aurora -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > build.log 2>&1
          find build -name "Aurora.app" -maxdepth 6 | head -3

      - name: boot a simulator and start the engine
        continue-on-error: true
        run: |
          set -x
          echo "--- available devices ---"
          xcrun simctl list devices available | head -20
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          if [ -z "${DEVICE:-}" ]; then
            RUNTIME=$(xcrun simctl list runtimes | awk -F '[()]' '/iOS/{print $2; exit}')
            TYPE=$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone/{print $2; exit}')
            echo "creating a device: type=$TYPE runtime=$RUNTIME"
            DEVICE=$(xcrun simctl create aurora-sim "$TYPE" "$RUNTIME")
          fi
          echo "device=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true
          APP=$(find Applications/Aurora-iOS/build -name 'Aurora.app' -maxdepth 6 | head -1)
          echo "app=$APP"
          xcrun simctl install "$DEVICE" "$APP" || true
          export SIMCTL_CHILD_AURORA_AUTOSTART=com.aurora.runtime.onscripter
          : > sim.log
          xcrun simctl launch --console-pty "$DEVICE" com.aurora.app >> sim.log 2>&1 &
          PID=$!
          sleep 20
          xcrun simctl io "$DEVICE" screenshot shot-1.png || true
          sleep 15
          xcrun simctl io "$DEVICE" screenshot shot-2.png || true
          kill "$PID" 2>/dev/null || true
          xcrun simctl terminate "$DEVICE" com.aurora.app 2>/dev/null || true
          # Even when the console stays silent, the device log tells us why.
          xcrun simctl spawn "$DEVICE" log show --style compact --last 3m \
            --predicate 'processImagePath CONTAINS "Aurora"' >> sim.log 2>&1 || true
          echo "--- sim.log ---"
          tail -60 sim.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ons-sim-run-logs
          path: |
            Applications/Aurora-iOS/gen.log
            Applications/Aurora-iOS/build.log
            sim.log
            shot-*.png
          if-no-files-found: warn

      - name: publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/ons-simrun-run${{ github.run_number }}.md"
          {
            echo "# ons-simrun run ${{ github.run_number }}"
            echo ""
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ""
            echo '## engine output'
            echo ''
            grep -E "onscripter|aurora|error" sim.log 2>/dev/null | head -30
            echo ''
            echo '## app build tail'
            echo ''
            tail -25 Applications/Aurora-iOS/build.log 2>/dev/null
            echo ''
            echo '## xcodegen tail'
            tail -10 Applications/Aurora-iOS/gen.log 2>/dev/null
            echo ''
            echo '## undefined symbols'
            awk '/Undefined symbols for architecture/{flag=1} flag{print; n++} n>20{exit}' Applications/Aurora-iOS/build.log 2>/dev/null
            echo ''
            echo '## onslib'
            ls onslib 2>/dev/null | head -5
            ls onslib/lib 2>/dev/null | head -5
            echo ''
            echo '## simulator tail'
            tail -25 sim.log 2>/dev/null
          } > "$file"
          git add "$file"
          git commit -m "ci: ons-simrun run ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

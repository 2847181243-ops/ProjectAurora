name: krkr-spike

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/krkr-spike'

jobs:
  engine:
    name: KiriKiri2 engine for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: mark started
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          printf '# krkr run ${{ github.run_number }}\n\nsha: %s\nstatus: running\nat: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "ci-status/krkr-run${{ github.run_number }}.md"
          git add ci-status
          git commit -m "ci: krkr started" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

      - name: clone the engine
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/reAAAq/KrKr2-Next third_party/krkr
          ls third_party/krkr | head -20

      - name: install build tools
        run: |
          set -euo pipefail
          brew install ninja autoconf automake autoconf-archive libtool pkg-config bison flex || true
          ninja --version
          autoconf --version | head -1
          echo "BISON_BIN=$(brew --prefix bison)/bin" >> "$GITHUB_ENV"
          "$(brew --prefix bison)/bin/bison" --version | head -1

      - name: prepare vcpkg
        run: |
          set -euo pipefail
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -x "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]; then
            echo "using the runner vcpkg at $VCPKG_INSTALLATION_ROOT"
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            echo "bootstrapping vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg third_party/vcpkg
            third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
            echo "VCPKG_ROOT=$PWD/third_party/vcpkg" >> "$GITHUB_ENV"
          fi
          echo "VCPKG_BINARY_SOURCES=clear;files,$PWD/krkr-vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          mkdir -p krkr-vcpkg-cache

      - uses: actions/cache@v4
        with:
          path: krkr-vcpkg-cache
          key: krkr-vcpkg-${${{ runner.os }}-${${{ hashFiles('.github/workflows/krkr-spike.yml') }}
          restore-keys: krkr-vcpkg-${${{ runner.os }}-
      - name: patch out the proprietary Live2D SDK
        run: |
          set -euo pipefail
          F=third_party/krkr/cpp/plugins/CMakeLists.txt
          python3 - "$F" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          # The Cubism SDK is proprietary and absent here; upstream still creates the
          # target unconditionally, which fails on an empty source glob. Make it an
          # interface target and downgrade every per-target property to INTERFACE.
          text = text.replace('add_library(CubismFramework STATIC ${CUBISM_FW_SOURCES})',
                              'add_library(CubismFramework INTERFACE)')
          text = re.sub(
              r'(target_(?:sources|include_directories|compile_definitions|compile_options|link_options|link_directories|link_libraries)\(\s*CubismFramework\s+)(PUBLIC|PRIVATE)',
              r'\1INTERFACE', text)
          # Without the SDK the feature flag must go too, or krkrgles.cpp and
          # engine_api.cpp still compile Live2D paths that reference missing symbols.
          text = re.sub(r'^\s*target_compile_definitions\(\$\{PROJECT_NAME\} PUBLIC KRKR2_LIVE2D\)\s*$',
                        '', text, flags=re.M)
          open(path, 'w', encoding='utf-8').write(text)
          print('patched CubismFramework into an interface target')
          PY
          grep -n 'CubismFramework\|KRKR2_LIVE2D' "$F" | head -12
          # Drop the Live2D plugin translation unit everywhere it is listed.
          for f in $(grep -rl 'krkrlive2d\.cpp' cpp --include=CMakeLists.txt); do
            sed -i '' '/krkrlive2d\.cpp/d' "$f"
            echo "removed krkrlive2d.cpp from $f"
          done
          # Some targets glob their sources, so the file has to go as well.
          rm -f cpp/plugins/krkrlive2d.cpp
          echo "deleted krkrlive2d.cpp"
      - name: configure for iOS
        continue-on-error: true
        run: |
          set -o pipefail
          cd third_party/krkr
          BISON_EXEC="$(brew --prefix bison)/bin/bison"
          FLEX_EXEC="$(brew --prefix flex)/bin/flex"
          echo "bison: $BISON_EXEC ($($BISON_EXEC --version | head -1))"
          /usr/bin/time -p cmake --preset 'iOS Release Config' \
            -DPATH="$BISON_BIN:$PATH" \
            -DBISON_EXECUTABLE="$BISON_EXEC" \
            -DFLEX_EXECUTABLE="$FLEX_EXEC" 2>&1 | tee ../../krkr-configure.log
          echo "exit=$?" >> ../../krkr-configure.log

      - name: build engine_api
        continue-on-error: true
        run: |
          set -o pipefail
          cd third_party/krkr
          /usr/bin/time -p cmake --build out/ios/release --target engine_api -j 6 2>&1 | tee ../../krkr-build.log
          find out/ios/release -name "*.a" | head -10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krkr-logs
          path: |
            krkr-configure.log
            krkr-build.log
          if-no-files-found: warn

      - name: publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/krkr-run${{ github.run_number }}.md"
          {
            echo "# krkr run ${{ github.run_number }}"
            echo ""
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ""
            echo "## configure errors"
            grep -E "CMake Error|error:|ERROR:" krkr-configure.log 2>/dev/null | head -12
            echo ""
            echo "## configure timing"
            tail -4 krkr-configure.log 2>/dev/null
            echo ""
            echo "## build errors"
            grep -E "error:|FAILED:" krkr-build.log 2>/dev/null | head -15
            echo ""
            echo "## build timing"
            tail -4 krkr-build.log 2>/dev/null
          } > "$file"
          git add "$file"
          git commit -m "ci: krkr run ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

name: sdl-spike

on:
  workflow_dispatch:

jobs:
  build-sdl-stack-ios:
    name: SDL2 stack for iOS arm64
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: clone sources
        run: |
          for r in SDL SDL_image SDL_ttf SDL_mixer sdl12-compat; do
            repo=$r
            case $r in
              SDL) repo=SDL ;;
              sdl12-compat) org=libsdl-org ;;
            esac
            git clone --depth 1 -b ${r}-2.0 https://github.com/libsdl-org/$r third_party/$r 2>/dev/null \
              || git clone --depth 1 -b SDL2 https://github.com/libsdl-org/$r third_party/$r 2>/dev/null \
              || git clone --depth 1 https://github.com/libsdl-org/$r third_party/$r 2>&1 | tail -2
          done
          ls third_party

      - name: build and install SDL2
        run: |
          set +e
          cmake -S third_party/SDL -B b/sdl -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF > b/sdl-configure.log 2>&1
          echo "configure $?"
          cmake --build b/sdl --config Release --target install > b/sdl-build.log 2>&1
          echo "build $?"
          tail -5 b/sdl-build.log

      - name: build sdl12-compat
        run: |
          set +e
          cmake -S third_party/sdl12-compat -B b/compat -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix -DCMAKE_PREFIX_PATH=$PWD/prefix \
            -DBSD_LIBDIR="" -DSDL12TESTS=OFF -DSDL12_COMPAT_INSTALL=OFF > b/compat-configure.log 2>&1
          echo "configure $?"
          cmake --build b/compat --config Release > b/compat-build.log 2>&1
          echo "build $?"
          tail -8 b/compat-build.log

      - name: build SDL2_image
        run: |
          set +e
          cmake -S third_party/SDL_image -B b/image -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_PREFIX_PATH=$PWD/prefix -DSDL2IMAGE_VENDORED=ON -DBUILD_SHARED_LIBS=OFF \
            -DSDL2IMAGE_SAMPLES=OFF > b/image-configure.log 2>&1
          echo "configure $?"
          cmake --build b/image --config Release > b/image-build.log 2>&1
          echo "build $?"
          tail -8 b/image-build.log

      - name: build SDL2_ttf
        run: |
          set +e
          cmake -S third_party/SDL_ttf -B b/ttf -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_PREFIX_PATH=$PWD/prefix -DSDL2TTF_VENDORED=ON -DBUILD_SHARED_LIBS=OFF \
            -DSDL2TTF_SAMPLES=OFF > b/ttf-configure.log 2>&1
          echo "configure $?"
          cmake --build b/ttf --config Release > b/ttf-build.log 2>&1
          echo "build $?"
          tail -8 b/ttf-build.log

      - name: build SDL2_mixer
        run: |
          set +e
          cmake -S third_party/SDL_mixer -B b/mixer -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_PREFIX_PATH=$PWD/prefix -DSDL2MIXER_VENDORED=ON -DBUILD_SHARED_LIBS=OFF \
            -DSDL2MIXER_SAMPLES=OFF -DSDL2MIXER_CMD=OFF > b/mixer-configure.log 2>&1
          echo "configure $?"
          cmake --build b/mixer --config Release > b/mixer-build.log 2>&1
          echo "build $?"
          tail -8 b/mixer-build.log

      - name: list static libraries
        run: find b -name "*.a" | sort | head -30

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl-stack-logs
          path: b/*.log
          if-no-files-found: warn

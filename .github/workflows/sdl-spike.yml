name: sdl-spike

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/sdl-spike'

jobs:
  build-sdl-stack-ios:
    name: SDL2 stack for iOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: mark started
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/sdl-spike-run${{ github.run_number }}.md"
          printf '# sdl-spike run ${{ github.run_number }}\n\nsha: %s\nstatus: running\nat: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$file"
          git add "$file"
          git commit -m "ci: sdl-spike started" || true
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true

      - name: publish status
        if: always()
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/sdl-spike-run${{ github.run_number }}.md"
          {
            echo "# sdl-spike run ${{ github.run_number }}"
            echo ''
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ''
            echo '## errors'
            echo ''
            grep -H -A3 -E "CMake Error|error:|FAILED" *.log 2>/dev/null | head -60
            echo ''
            echo '## tails'
            for f in *.log; do
              [ -f "$f" ] || continue
              echo ''
              echo "### $f"
              tail -12 "$f"
            done
          } > "$file"
          git add "$file"
          git commit -m "ci: sdl-spike run ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true

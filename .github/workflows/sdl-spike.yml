name: sdl-spike

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/sdl-spike'

jobs:
  sdl2:
    name: SDL2 static
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone SDL2
        run: git clone --depth 1 -b SDL2 https://github.com/libsdl-org/SDL third_party/SDL
      - name: build SDL2
        run: |
          set -euo pipefail
          cmake -S third_party/SDL -B b/sdl -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_FRAMEWORK=OFF -DSDL_TESTS=OFF -DSDL_INSTALL=ON \
            -DSDL_OPENGL=OFF -DSDL_OPENGLES=ON 2>&1 | tee sdl.log
          cmake --build b/sdl --config Release --target install 2>&1 | tee -a sdl.log
      - uses: actions/upload-artifact@v4
        with:
          name: sdl2-prefix
          path: |
            prefix/
            b/sdl/**/*.a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl2-log
          path: sdl.log
      - name: publish status
        if: always()
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/sdl2-run${{ github.run_number }}.md"
          {
            echo "# sdl2"
            echo ''
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ''
            echo '## errors'
            echo ''
            grep -H -A3 -E "CMake Error|error:|FAILED" *.log 2>/dev/null | head -40
            echo ''
            echo '## tails'
            for f in *.log; do [ -f "$f" ] || continue; echo ""; echo "### $f"; tail -12 "$f"; done
          } > "$file"
          git add "$file"
          git commit -m "ci: sdl2 ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true

  addon:
    name: ${{ matrix.lib }}
    needs: sdl2
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        lib: [sdl12-compat, SDL_image, SDL_ttf, SDL_mixer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdl2-prefix
          path: stack
      - name: clone ${{ matrix.lib }}
        run: |
          set -euo pipefail
          case "${{ matrix.lib }}" in
            sdl12-compat) git clone --depth 1 https://github.com/libsdl-org/sdl12-compat third_party/lib ;;
            *) git clone --depth 1 --recurse-submodules --shallow-submodules -b SDL2 https://github.com/libsdl-org/${{ matrix.lib }} third_party/lib ;;
          esac
      - name: build ${{ matrix.lib }}
        run: |
          set -euo pipefail
          PREFIX=$PWD/stack/prefix
          EXTRA=""
          case "${{ matrix.lib }}" in
            sdl12-compat)
              sed -i '' 's/^if(APPLE)$/if(APPLE AND NOT IOS)/' third_party/lib/CMakeLists.txt
              EXTRA="-DSDL12TESTS=OFF"
              ;;
            SDL_image) EXTRA="-DSDL2IMAGE_VENDORED=ON -DSDL2IMAGE_SAMPLES=OFF -DSDL2IMAGE_AVIF=OFF -DSDL2IMAGE_JXL=OFF -DSDL2IMAGE_WEBP=OFF -DSDL2IMAGE_TIF=OFF" ;;
            SDL_ttf) EXTRA="-DSDL2TTF_VENDORED=ON -DSDL2TTF_SAMPLES=OFF -DSDL2TTF_HARFBUZZ=OFF" ;;
            SDL_mixer) EXTRA="-DSDL2MIXER_VENDORED=ON -DSDL2MIXER_SAMPLES=OFF -DSDL2MIXER_CMD=OFF -DSDL2MIXER_WAVPACK=OFF -DSDL2MIXER_FLAC=OFF -DSDL2MIXER_OPUS=OFF -DSDL2MIXER_GME=OFF" ;;
          esac
          cmake -S third_party/lib -B b/lib -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_PREFIX_PATH=$PREFIX -DSDL2_DIR=$PREFIX/lib/cmake/SDL2 -DBUILD_SHARED_LIBS=OFF $EXTRA 2>&1 | tee addon.log
          cmake --build b/lib --config Release 2>&1 | tee -a addon.log
          find b/lib -name "*.a" | tee -a addon.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.lib }}-log
          path: addon.log
      - name: publish status
        if: always()
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/addon-${{ matrix.lib }}-run${{ github.run_number }}.md"
          {
            echo "# addon-${{ matrix.lib }}"
            echo ''
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ''
            echo '## errors'
            echo ''
            grep -H -A3 -E "CMake Error|error:|FAILED" *.log 2>/dev/null | head -40
            echo ''
            echo '## tails'
            for f in *.log; do [ -f "$f" ] || continue; echo ""; echo "### $f"; tail -12 "$f"; done
          } > "$file"
          git add "$file"
          git commit -m "ci: addon-${{ matrix.lib }} ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true

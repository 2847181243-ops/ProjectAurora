name: ci

on:
  # push disabled while iterating on krkr
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: licence policy
        run: python3 BuildSystem/check_licenses.py

      - name: module boundaries
        run: python3 BuildSystem/check_module_boundaries.py

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build --config Release --parallel 4

      - name: test
        run: ctest --test-dir build --output-on-failure -C Release

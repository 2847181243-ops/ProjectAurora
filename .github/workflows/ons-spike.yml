name: ons-spike

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/ons-spike'

jobs:
  ons:
    name: ONScripter objects for iOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: mark started
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          printf '# ons run ${{ github.run_number }}\n\nsha: %s\nstatus: running\nat: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "ci-status/ons-run${{ github.run_number }}.md"
          git add ci-status
          git commit -m "ci: ons started" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

      - name: build SDL2 and sdl12-compat
        run: |
          set -euo pipefail
          git clone --depth 1 -b SDL2 https://github.com/libsdl-org/SDL third_party/SDL
          git clone --depth 1 https://github.com/libsdl-org/sdl12-compat third_party/sdl12-compat
          COMMON="-G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DBUILD_SHARED_LIBS=OFF"

          cmake -S third_party/SDL -B b/sdl $COMMON -DCMAKE_INSTALL_PREFIX=$PWD/prefix \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_FRAMEWORK=OFF -DSDL_TESTS=OFF -DSDL_INSTALL=ON \
            -DSDL_OPENGL=OFF -DSDL_OPENGLES=ON > stack.log 2>&1
          cmake --build b/sdl --config Release --target install >> stack.log 2>&1

          cp Modules/ONScripter/sdl12_gl_stub.h .
          sed -i '' 's/^if(APPLE)$/if(APPLE AND NOT IOS)/' third_party/sdl12-compat/CMakeLists.txt
          sed -i '' 's/add_library(SDL SHARED/add_library(SDL STATIC/' third_party/sdl12-compat/CMakeLists.txt
          cmake -S third_party/sdl12-compat -B b/compat $COMMON -DCMAKE_INSTALL_PREFIX=$PWD/prefix \
            -DCMAKE_PREFIX_PATH=$PWD/prefix -DSDL2_DIR=$PWD/prefix/lib/cmake/SDL2 -DSDL12TESTS=OFF -DSDL12DEVEL=ON \
            "-DCMAKE_C_FLAGS=-include$PWD/sdl12_gl_stub.h" >> stack.log 2>&1
          cmake --build b/compat --config Release --target install >> stack.log 2>&1
          echo "--- installed headers ---" | tee -a stack.log
          ls prefix/include | tee -a stack.log
          echo "--- installed libraries ---" | tee -a stack.log
          ls prefix/lib | tee -a stack.log
          test -f prefix/lib/libSDL-1.2.a

      - name: compile the engine
        continue-on-error: true
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/Galladite27/ONScripter-EN third_party/onscripter
          # SDL 1.2 add-on headers: SDL2's would drag SDL2 core headers into the same TU.
          git clone --depth 1 https://github.com/yeatse/ONScripter-iOS third_party/iosons
          IOSONS=third_party/iosons
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cp Modules/ONScripter/sdl12_compat_shim.h .
          CXX="clang++ -std=gnu++14 -arch arm64 -mios-version-min=16.0 -isysroot $SDK -w -Wno-c++11-narrowing -include$PWD/sdl12_compat_shim.h"
          INC="-I Modules/ONScripter/smpeg -I prefix/include -I prefix/include/SDL -I $IOSONS/SDL_image -I $IOSONS/SDL_ttf -I $IOSONS/SDL_mixer"
          mkdir -p obj
          : > ons.log

          if ! $CXX $INC -I Modules/ONScripter/src -c Modules/ONScripter/smpeg/aurora_smpeg.mm -o obj/aurora_smpeg.o >> ons.log 2>&1; then
            echo "FAILED: aurora_smpeg.mm" >> ons.log
          fi

          ok=0; fail=0
          for f in third_party/onscripter/*.cpp Modules/ONScripter/src/ons_engine_onscripter.cpp; do
            case "$(basename "$f")" in
              nscriptdecode.cpp|AVIWrapper.cpp|LUAHandler.cpp|MadWrapper.cpp|X11_messagebox.cpp) continue ;;
            esac
            out="obj/$(basename "${f%.cpp}").o"
            if $CXX $INC -I third_party/onscripter -I Modules/ONScripter/src \
                -DSDL_MAIN_HANDLED -D_REENTRANT -DAURORA_WITH_ONSCRIPTER \
                -c "$f" -o "$out" >> ons.log 2>&1; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); echo "FAILED: $(basename "$f")" >> ons.log
            fi
          done
          echo "compiled=$ok failed=$fail" | tee -a ons.log

      - name: archive the engine
        run: |
          set -euo pipefail
          mkdir -p lib include/aurora-ons
          libtool -static -o lib/libaurora_onscripter.a obj/*.o
          cp Modules/ONScripter/smpeg/*.h include/aurora-ons/
          cp Modules/ONScripter/src/*.h include/aurora-ons/
          ls -la lib
          lipo -info lib/libaurora_onscripter.a

      - name: upload the engine
        uses: actions/upload-artifact@v4
        with:
          name: aurora-onscripter
          path: |
            lib/libaurora_onscripter.a
            include/aurora-ons/
            prefix/include/
            prefix/lib/*.a

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-spike-output
          path: |
            stack.log
            ons.log
            obj/
          if-no-files-found: warn

      - name: verdict
        run: |
          set -euo pipefail
          tail -3 ons.log
          failed=$(grep -c "^FAILED:" ons.log || true)
          ok=$(ls obj/*.o 2>/dev/null | wc -l | tr -d ' ')
          echo "objects=$ok failed=$failed"
          if [ "$failed" -gt 0 ]; then
            grep "^FAILED:" ons.log
            exit 1
          fi
          test "$ok" -ge 30

      - name: publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/ons-run${{ github.run_number }}.md"
          {
            echo "# ons run ${{ github.run_number }}"
            echo ""
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ""
            echo "## errors"
            echo ""
            grep -hE "error:|FAILED:|CMake Error" ons.log stack.log 2>/dev/null | head -40
            echo ""
            echo "## stack tail"
            tail -15 stack.log 2>/dev/null
            echo ""
            echo "## summary"
            tail -3 ons.log 2>/dev/null
          } > "$file"
          git add "$file"
          git commit -m "ci: ons run ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

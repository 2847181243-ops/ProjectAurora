name: ons-spike

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/ons-spike'

jobs:
  ons:
    name: ONScripter objects for iOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: mark started
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          printf '# ons run ${{ github.run_number }}\n\nsha: %s\nstatus: running\nat: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "ci-status/ons-run${{ github.run_number }}.md"
          git add ci-status
          git commit -m "ci: ons started" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

      - name: build SDL2 and sdl12-compat
        run: |
          set -euo pipefail
          git clone --depth 1 -b SDL2 https://github.com/libsdl-org/SDL third_party/SDL
          git clone --depth 1 https://github.com/libsdl-org/sdl12-compat third_party/sdl12-compat
          COMMON="-G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DBUILD_SHARED_LIBS=OFF"

          cmake -S third_party/SDL -B b/sdl $COMMON -DCMAKE_INSTALL_PREFIX=$PWD/prefix \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_FRAMEWORK=OFF -DSDL_TESTS=OFF -DSDL_INSTALL=ON \
            -DSDL_OPENGL=OFF -DSDL_OPENGLES=ON > stack.log 2>&1
          cmake --build b/sdl --config Release --target install >> stack.log 2>&1

          cp Modules/ONScripter/sdl12_gl_stub.h .
          sed -i '' 's/^if(APPLE)$/if(APPLE AND NOT IOS)/' third_party/sdl12-compat/CMakeLists.txt
          sed -i '' 's/add_library(SDL SHARED/add_library(SDL STATIC/' third_party/sdl12-compat/CMakeLists.txt
          cmake -S third_party/sdl12-compat -B b/compat $COMMON -DCMAKE_INSTALL_PREFIX=$PWD/prefix \
            -DCMAKE_PREFIX_PATH=$PWD/prefix -DSDL2_DIR=$PWD/prefix/lib/cmake/SDL2 -DSDL12TESTS=OFF -DSDL12DEVEL=ON \
            "-DCMAKE_C_FLAGS=-include$PWD/sdl12_gl_stub.h" >> stack.log 2>&1
          cmake --build b/compat --config Release --target install >> stack.log 2>&1
          echo "--- installed headers ---" | tee -a stack.log
          ls prefix/include | tee -a stack.log
          echo "--- installed libraries ---" | tee -a stack.log
          ls prefix/lib | tee -a stack.log
          test -f prefix/lib/libSDL-1.2.a

      - name: build image, font and audio dependencies
        continue-on-error: true
        run: |
          set -euo pipefail
          COMMON="-G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=$PWD/prefix"
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)

          git clone --depth 1 https://github.com/pnggroup/libpng third_party/libpng
          # libjpeg-turbo reads its version from git tags, so a shallow clone without
          # history breaks its CMake; take a release tag instead.
          git clone --depth 1 --branch 3.0.4 https://github.com/libjpeg-turbo/libjpeg-turbo third_party/libjpeg || \
            git clone https://github.com/libjpeg-turbo/libjpeg-turbo third_party/libjpeg
          git clone --depth 1 https://github.com/freetype/freetype third_party/freetype
          git clone --depth 1 https://github.com/xiph/ogg third_party/ogg
          git clone --depth 1 https://github.com/xiph/vorbis third_party/vorbis

          {
            cmake -S third_party/libpng -B b/png $COMMON -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DZLIB_INCLUDE_DIR=$SDKROOT/usr/include -DZLIB_LIBRARY=$SDKROOT/usr/lib/libz.tbd
            cmake --build b/png --config Release --target install
          } > png.log 2>&1 || echo "FAILED: libpng" >> png.log

          {
            cmake -S third_party/libjpeg -B b/jpeg $COMMON -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_SIMD=OFF -DWITH_TURBOJPEG=OFF
            cmake --build b/jpeg --config Release --target install
          } > jpeg.log 2>&1 || echo "FAILED: libjpeg" >> jpeg.log

          {
            cmake -S third_party/freetype -B b/ft $COMMON -DFT_DISABLE_PNG=ON -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON
            cmake --build b/ft --config Release --target install
          } > freetype.log 2>&1 || echo "FAILED: freetype" >> freetype.log

          {
            cmake -S third_party/ogg -B b/ogg $COMMON
            cmake --build b/ogg --config Release --target install
          } > ogg.log 2>&1 || echo "FAILED: ogg" >> ogg.log

          {
            cmake -S third_party/vorbis -B b/vorbis $COMMON -DOGG_INCLUDE_DIR=$PWD/prefix/include -DOGG_LIBRARY=$PWD/prefix/lib/libogg.a
            cmake --build b/vorbis --config Release --target install
          } > vorbis.log 2>&1 || echo "FAILED: vorbis" >> vorbis.log

          ls prefix/lib | sort | tee -a stack.log

      - name: build the SDL 1.2 add-ons
        continue-on-error: true
        run: |
          set -o pipefail
          git clone --depth 1 -b SDL-1.2 https://github.com/libsdl-org/SDL_image third_party/SDL_image12
          git clone --depth 1 -b SDL-1.2 https://github.com/libsdl-org/SDL_ttf third_party/SDL_ttf12
          git clone --depth 1 -b SDL-1.2 https://github.com/libsdl-org/SDL_mixer third_party/SDL_mixer12
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="clang -arch arm64 -mios-version-min=16.0 -isysroot $SDK -w -O2"
          INC="-I prefix/include -I prefix/include/SDL -I prefix/include/freetype2"
          mkdir -p obj/addons
          : > addons.log

          # SDL_image: bmp, gif, jpg, lbm, pcx, png, pnm, tga, xpm (tif/xcf/webp need extra deps)
          IMG=third_party/SDL_image12
          for f in IMG IMG_xxx IMG_bmp IMG_gif IMG_jpg IMG_lbm IMG_pcx IMG_png IMG_pnm IMG_tga IMG_xpm; do
            $CC $INC -I "$IMG" -DLOAD_BMP -DLOAD_GIF -DLOAD_JPG -DLOAD_LBM -DLOAD_PCX -DLOAD_PNG -DLOAD_PNM -DLOAD_TGA -DLOAD_XPM \
              -c "$IMG/$f.c" -o "obj/addons/$f.o" >> addons.log 2>&1 || echo "FAILED: image/$f" >> addons.log
          done

          # SDL_ttf: one file plus freetype
          $CC $INC -c third_party/SDL_ttf12/SDL_ttf.c -o obj/addons/SDL_ttf.o >> addons.log 2>&1 || echo "FAILED: ttf" >> addons.log

          # SDL_mixer: wave/aiff/voc/ogg only
          MIX=third_party/SDL_mixer12
          for f in mixer music wave load_aiff load_voc load_ogg music_ogg dynamic_ogg effects_internal effect_position effect_stereoreverse; do
            [ -f "$MIX/$f.c" ] || continue
            $CC $INC -I "$MIX" -DWAV_MUSIC -DAIFF_MUSIC -DVOC_MUSIC -DOGG_MUSIC -DVORBIS_HEADER \
              -c "$MIX/$f.c" -o "obj/addons/$f.o" >> addons.log 2>&1 || echo "FAILED: mixer/$f" >> addons.log
          done

          libtool -static -o prefix/lib/libSDL_image.a obj/addons/IMG*.o
          libtool -static -o prefix/lib/libSDL_ttf.a obj/addons/SDL_ttf.o
          libtool -static -o prefix/lib/libSDL_mixer.a obj/addons/mixer.o obj/addons/music.o obj/addons/wave.o obj/addons/load_*.o obj/addons/music_ogg.o obj/addons/dynamic_ogg.o obj/addons/effect*.o obj/addons/effects_internal.o
          ls obj/addons | tee -a addons.log
          ls -la prefix/lib/libSDL_*.a | tee -a addons.log

      - name: compile the engine
        continue-on-error: true
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/Galladite27/ONScripter-EN third_party/onscripter
          # SDL 1.2 add-on headers: SDL2's would drag SDL2 core headers into the same TU.
          git clone --depth 1 https://github.com/yeatse/ONScripter-iOS third_party/iosons
          IOSONS=third_party/iosons
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cp Modules/ONScripter/sdl12_compat_shim.h .
          CXX="clang++ -std=gnu++14 -arch arm64 -mios-version-min=16.0 -isysroot $SDK -w -Wno-c++11-narrowing -include$PWD/sdl12_compat_shim.h"
          INC="-I Modules/ONScripter/smpeg -I prefix/include -I prefix/include/SDL -I $IOSONS/SDL_image -I $IOSONS/SDL_ttf -I $IOSONS/SDL_mixer"
          mkdir -p obj
          : > ons.log

          if ! $CXX $INC -I Modules/ONScripter/src -c Modules/ONScripter/smpeg/aurora_smpeg.mm -o obj/aurora_smpeg.o >> ons.log 2>&1; then
            echo "FAILED: aurora_smpeg.mm" >> ons.log
          fi

          ok=0; fail=0
          for f in third_party/onscripter/*.cpp Modules/ONScripter/src/ons_engine_onscripter.cpp; do
            case "$(basename "$f")" in
              nscriptdecode.cpp|AVIWrapper.cpp|LUAHandler.cpp|MadWrapper.cpp|X11_messagebox.cpp) continue ;;
            esac
            out="obj/$(basename "${f%.cpp}").o"
            if $CXX $INC -I third_party/onscripter -I Modules/ONScripter/src \
                -DSDL_MAIN_HANDLED -D_REENTRANT -DAURORA_WITH_ONSCRIPTER \
                -c "$f" -o "$out" >> ons.log 2>&1; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); echo "FAILED: $(basename "$f")" >> ons.log
            fi
          done
          echo "compiled=$ok failed=$fail" | tee -a ons.log

      - name: archive the engine
        run: |
          set -euo pipefail
          mkdir -p lib include/aurora-ons
          libtool -static -o lib/libaurora_onscripter.a obj/*.o
          cp Modules/ONScripter/smpeg/*.h include/aurora-ons/
          cp Modules/ONScripter/src/*.h include/aurora-ons/
          ls -la lib
          lipo -info lib/libaurora_onscripter.a

      - name: upload the engine
        uses: actions/upload-artifact@v4
        with:
          name: aurora-onscripter
          path: |
            lib/libaurora_onscripter.a
            include/aurora-ons/
            prefix/include/
            prefix/lib/*.a

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-spike-output
          path: |
            *.log
            obj/
          if-no-files-found: warn

      - name: verdict
        run: |
          set -euo pipefail
          tail -3 ons.log
          failed=$(grep -c "^FAILED:" ons.log || true)
          ok=$(ls obj/*.o 2>/dev/null | wc -l | tr -d ' ')
          echo "objects=$ok failed=$failed"
          if [ "$failed" -gt 0 ]; then
            grep "^FAILED:" ons.log
            exit 1
          fi
          test "$ok" -ge 30

      - name: publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/ons-run${{ github.run_number }}.md"
          {
            echo "# ons run ${{ github.run_number }}"
            echo ""
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ""
            echo "## errors"
            echo ""
            grep -hE "error:|FAILED:|CMake Error" ons.log stack.log 2>/dev/null | head -40
            echo ""
            echo "## stack tail"
            tail -15 stack.log 2>/dev/null
            echo ""
            echo "## summary"
            tail -3 ons.log 2>/dev/null
          } > "$file"
          git add "$file"
          git commit -m "ci: ons run ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

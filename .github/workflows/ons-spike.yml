name: ons-spike

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/ons-spike'

jobs:
  ons:
    name: ONScripter iOS stack
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: mark started
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          printf '# ons run ${{ github.run_number }}\n\nsha: %s\nstatus: running\nat: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "ci-status/ons-run${{ github.run_number }}.md"
          git add ci-status
          git commit -m "ci: ons started" || true
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true

      - name: clone the port
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/yeatse/ONScripter-iOS third_party/port
          ls third_party/port

      - name: build lua and smpeg
        continue-on-error: true
        run: |
          set -o pipefail
          cd third_party/port
          # armv7 and bitcode are long gone; target arm64 with our deployment floor.
          sed -i '' "s/-arch armv7 -arch arm64 -miphoneos-version-min=8.0 -fembed-bitcode/-arch arm64 -miphoneos-version-min=16.0/" dev_iPhoneOS.sh
          cat dev_iPhoneOS.sh
          source ./dev_iPhoneOS.sh
          make 2>&1 | tee ../../lua_smpeg.log
          ls -la Release-iphoneos/lib || true

      - name: build the SDL libraries
        continue-on-error: true
        run: |
          set -o pipefail
          cd third_party/port
          for proj in SDL/Xcode-iOS/SDL SDL_image/Xcode-iOS/SDL_image SDL_ttf/Xcode-iOS/SDL_ttf SDL_mixer/Xcode-iOS/SDL_mixer; do
            name=$(basename "$proj")
            xcodebuild -project "$proj/$name.xcodeproj" -target "$name" -configuration Release -sdk iphoneos \
              ARCHS=arm64 IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              build >> ../../sdl_projects.log 2>&1 || echo "FAILED: $name" >> ../../sdl_projects.log
          done
          grep -E "FAILED:|BUILD SUCCEEDED|BUILD FAILED" ../../sdl_projects.log | tail -20

      - name: build ONScripter
        continue-on-error: true
        run: |
          set -o pipefail
          cd third_party/port
          xcodebuild -project ONScripter.xcodeproj -target ONScripter -configuration Release -sdk iphoneos \
            ARCHS=arm64 IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../../ons_build.log | tail -30
          find . -name "*.app" -maxdepth 6 | head -5

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-spike-output
          path: |
            lua_smpeg.log
            sdl_projects.log
            ons_build.log
          if-no-files-found: warn

      - name: verdict
        run: |
          set -euo pipefail
          for f in lua_smpeg.log sdl_projects.log ons_build.log; do
            echo "=== $f ==="
            [ -f "$f" ] && tail -5 "$f" || echo "(missing)"
          done
          if grep -qE "\*\* BUILD FAILED \*\*" sdl_projects.log ons_build.log 2>/dev/null; then
            grep -E "error:" sdl_projects.log ons_build.log 2>/dev/null | head -15
            echo "port does not build"
            exit 1
          fi
          test -d third_party/port/Release-iphoneos/lib

      - name: publish status
        if: always()
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/ons-run${{ github.run_number }}.md"
          {
            echo "# ons run ${{ github.run_number }}"
            echo ""
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ""
            echo "## errors"
            echo ""
            grep -hE "error:|FAILED:|BUILD FAILED" lua_smpeg.log sdl_projects.log ons_build.log 2>/dev/null | head -30
            echo ""
            echo "## tails"
            for f in lua_smpeg.log sdl_projects.log ons_build.log; do
              [ -f "$f" ] || continue
              echo ""
              echo "### $f"
              tail -10 "$f"
            done
          } > "$file"
          git add "$file"
          git commit -m "ci: ons run ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true

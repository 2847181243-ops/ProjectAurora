name: ppsspp-spike

on:
  workflow_dispatch:
    inputs:
      gles:
        description: "1 builds the core against OpenGL ES instead of desktop GL"
        required: false
        default: "1"

jobs:
  build-libretro-core:
    name: PPSSPP libretro core for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: clone PPSSPP with submodules
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp third_party/ppsspp
          du -sh third_party/ppsspp

      - name: point the GLES link at the iOS framework
        working-directory: third_party/ppsspp
        run: |
          set -euo pipefail
          # Upstream links -lGLESv2 -lEGL, which only exist on Android/Linux. iOS
          # ships the same API inside OpenGLES.framework.
          sed -i '' 's/set(OPENGL_LIBRARIES GLESv2 EGL)/set(OPENGL_LIBRARIES "-framework OpenGLES")/' CMakeLists.txt
          grep -n 'OPENGL_LIBRARIES' CMakeLists.txt | head -5
      - name: configure for iOS arm64
        working-directory: third_party/ppsspp
        run: |
          set -euo pipefail
          # iOS has no desktop GL; the libretro core has to be told to use GLES.
          # Failures here are fatal on purpose: the previous spike reported success
          # while CMake had already refused to generate a project.
          if [ "${{ github.event.inputs.gles || '1' }}" = "1" ]; then
            GLFLAGS="-DUSING_GLES2=ON -DUSING_GL=OFF -DUSING_VULKAN=OFF -DUSING_D3D11=OFF"
          else
            GLFLAGS=""
          fi
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DUSE_MINIUPNPC=OFF \
            -DUSE_SYSTEM_MINIUPNPC=OFF \
            "-DCMAKE_C_FLAGS=-DMOBILE_DEVICE" \
            "-DCMAKE_CXX_FLAGS=-DMOBILE_DEVICE" \
            -DLIBRETRO=ON -DHEADLESS=OFF $GLFLAGS 2>&1 | tee configure.log
          ls -1 build-ios

      - name: build core
        working-directory: third_party/ppsspp
        run: |
          set -euo pipefail
          cmake --build build-ios --config Release --target ppsspp_libretro 2>&1 | tee build.log
          find build-ios -name "*.a" | head -20
          ls -la build-ios/Release 2>/dev/null || true

      - name: collect the core
        working-directory: third_party/ppsspp
        run: |
          set -euo pipefail
          mkdir -p core-out/include core-out/lib
          # The libretro headers are generated into the build tree.
          cp libretro/libretro.h core-out/include/ 2>/dev/null || cp $(find . -name libretro.h | head -1) core-out/include/
          cp build-ios/lib/Release/ppsspp_libretro.dylib core-out/lib/ 2>/dev/null || true
          for f in $(find build-ios -name 'ppsspp_libretro*.a' -o -name 'libppsspp*.a'); do cp "$f" core-out/lib/; done
          ls -la core-out/lib core-out/include
      - name: upload the core
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-core
          path: third_party/ppsspp/core-out
          if-no-files-found: error
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-spike-logs
          path: |
            third_party/ppsspp/configure.log
            third_party/ppsspp/build.log
          if-no-files-found: warn

name: ppsspp-spike

on:
  workflow_dispatch:

jobs:
  build-libretro-core:
    name: PPSSPP libretro core for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: clone PPSSPP with submodules
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp third_party/ppsspp 2>&1 | tail -5
          du -sh third_party/ppsspp || true

      - name: configure for iOS arm64
        working-directory: third_party/ppsspp
        run: |
          set -euo pipefail
          cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DLIBRETRO=ON -DHEADLESS=OFF > configure.log 2>&1
          echo "configure exit: $?"
          tail -40 configure.log

      - name: build core
        working-directory: third_party/ppsspp
        run: |
          set -euo pipefail
          cmake --build build-ios --config Release --target ppsspp_libretro > build.log 2>&1
          echo "build exit: $?"
          tail -60 build.log
          find build-ios -name "*.a" | head -20

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-spike-logs
          path: |
            third_party/ppsspp/configure.log
            third_party/ppsspp/build.log
          if-no-files-found: warn

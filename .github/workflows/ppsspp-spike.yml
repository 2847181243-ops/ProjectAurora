name: ppsspp-spike

on:
  workflow_dispatch:
    inputs:
      gles:
        description: "1 builds the core against OpenGL ES instead of desktop GL"
        required: false
        default: "1"

jobs:
  build-libretro-core:
    name: PPSSPP libretro core for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: clone PPSSPP with submodules
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp third_party/ppsspp
          du -sh third_party/ppsspp

      - name: configure for iOS arm64
        working-directory: third_party/ppsspp
        run: |
          set -euo pipefail
          # iOS has no desktop GL; the libretro core has to be told to use GLES.
          # Failures here are fatal on purpose: the previous spike reported success
          # while CMake had already refused to generate a project.
          if [ "${{ github.event.inputs.gles || '1' }}" = "1" ]; then
            GLFLAGS="-DUSING_GLES2=ON -DUSING_GL=OFF -DUSING_VULKAN=OFF -DUSING_D3D11=OFF"
          else
            GLFLAGS=""
          fi
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DLIBRETRO=ON -DHEADLESS=OFF $GLFLAGS 2>&1 | tee configure.log
          ls -1 build-ios

      - name: build core
        working-directory: third_party/ppsspp
        run: |
          set -euo pipefail
          cmake --build build-ios --config Release --target ppsspp_libretro 2>&1 | tee build.log
          find build-ios -name "*.a" | head -20
          ls -la build-ios/Release 2>/dev/null || true

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-spike-logs
          path: |
            third_party/ppsspp/configure.log
            third_party/ppsspp/build.log
          if-no-files-found: warn

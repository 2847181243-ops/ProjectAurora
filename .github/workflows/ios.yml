name: ios

permissions:
  contents: write

on:
  # push disabled while iterating on krkr
  workflow_dispatch:
  push:
    paths:
      - 'ci-triggers/ios'

jobs:
  unsigned-ipa:
    name: unsigned ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every build step keeps its own log and does not abort the job, so a
      # failure is still diagnosable from the uploaded artifacts.
      - name: fetch the engine
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run_id=$(gh run list --workflow ons-spike.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          echo "ons run: ${run_id:-none}"
          if [ -n "${run_id:-}" ]; then
            gh run download "$run_id" -n aurora-onscripter -D onslib || echo "artifact download failed"
          fi
          ls -la onslib 2>/dev/null || true
          ls onslib/lib 2>/dev/null || true

      - name: fetch the KiriKiri engine
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run_id=$(gh run list --workflow krkr-spike.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          echo "krkr run: ${run_id:-none}"
          if [ -n "${run_id:-}" ]; then
            gh run download "$run_id" -n krkr-ios-engine -D krkrlib || echo "artifact download failed"
          fi
          ls -la krkrlib 2>/dev/null | head -10
          ls -la krkrlib/*.a 2>/dev/null | head -5

      - name: generate module table
        continue-on-error: true
        run: python3 BuildSystem/generate_builtin_table.py --out Applications/Aurora-iOS/Generated/AuroraBuiltinModules.cpp 2>&1 | tee gen.log

      - name: install xcodegen
        continue-on-error: true
        run: brew install xcodegen 2>&1 | tee toolchain.log

      - name: generate project
        continue-on-error: true
        working-directory: Applications/Aurora-iOS
        run: xcodegen generate 2>&1 | tee project.log

      - name: archive without signing
        continue-on-error: true
        working-directory: Applications/Aurora-iOS
        run: |
          xcodebuild \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive \
            -archivePath build/Aurora.xcarchive 2>&1 | tee archive.log

      - name: upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            *.log
            Applications/Aurora-iOS/*.log
          if-no-files-found: warn

      - name: package ipa
        id: package
        continue-on-error: true
        run: |
          mkdir -p out/Payload
          cp -R Applications/Aurora-iOS/build/Aurora.xcarchive/Products/Applications/Aurora.app out/Payload/
          cd out && zip -qry Aurora-unsigned.ipa Payload
          ls -la Aurora-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aurora-unsigned-ipa
          path: out/Aurora-unsigned.ipa
          if-no-files-found: warn

      - name: verdict
        run: |
          set -euo pipefail
          matches=$(grep -hE "error:|ARCHIVE FAILED|BUILD FAILED" *.log Applications/Aurora-iOS/*.log 2>/dev/null | head -20 || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "build reported errors"
            exit 1
          fi
          if [ ! -d Applications/Aurora-iOS/build/Aurora.xcarchive ]; then
            echo "no xcarchive produced"
            exit 1
          fi
          echo "archive ok"

      - name: publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          file="ci-status/ios-run${{ github.run_number }}.md"
          {
            echo "# ios run ${{ github.run_number }}"
            echo ''
            echo "sha: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "at: $(date -u +%FT%TZ)"
            echo ''
            echo '## errors'
            echo ''
            grep -H -A3 -E "CMake Error|error:|FAILED" *.log 2>/dev/null | head -60
            echo ''
            echo '## tails'
            for f in *.log Applications/Aurora-iOS/*.log; do
              [ -f "$f" ] || continue
              echo ''
              echo "### $f"
              tail -20 "$f"
            done
            echo ''
            echo '## archive tail'
            awk '/Undefined symbols for architecture/{flag=1} flag{print; n++} n>25{exit}' Applications/Aurora-iOS/archive.log 2>/dev/null
          } > "$file"
          git add "$file"
          git commit -m "ci: ios run ${{ github.run_number }}" || true
          git pull --rebase --autostash origin main || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || true

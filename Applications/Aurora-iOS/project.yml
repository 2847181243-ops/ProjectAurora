# XcodeGen description. The Xcode project is generated, never committed: a
# project.pbxproj that several people edit by hand is a merge conflict generator.
name: Aurora
options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../SDK/AuroraRuntimeAPI/src
      - path: ../../SDK/AuroraModuleSDK/src
      - path: ../../SDK/AuroraStorageAPI/src
      - path: ../../SDK/AuroraDiagnosticsAPI/src
      - path: ../../SDK/AuroraLibrary/src
      - path: ../../SDK/AuroraDisplayAPI/src
      - path: ../../SDK/AuroraInputAPI/src
      # The whole Modules tree, not a hand-written list: a module added to
      # Modules/modules.list must not require an edit here, or the "one line to add
      # a module" promise is false on the iOS side.
      - path: ../../Modules
        excludes:
          - "**/CMakeLists.txt"
          - "**/*.md"
          - "**/modules.list"
          # Engine side of the module ships inside the prebuilt library.
          - "ONScripter/smpeg/*.mm"
          - "ONScripter/src/ons_engine_onscripter.cpp"
          - "ONScripter/engine/*.cpp"
      - path: Generated/AuroraBuiltinModules.cpp
      - path: ../../ModuleManifests
        buildPhase: resources
        type: folder
      # The smoke-test game, so a CI run can start the engine without a human.
      - path: ../../TestGames
        buildPhase: resources
        type: folder
    postBuildScripts:
      - name: embed SDL2 dylib
        script: |
          # sdl12-compat dlopen()s "@executable_path/libSDL2-2.0.0.dylib".
          SRC="${SRCROOT}/../../onslib/prefix/lib/libSDL2-2.0.0.dylib"
          if [ -f "$SRC" ]; then
            cp "$SRC" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/"
          else
            echo "warning: no SDL2 dylib at $SRC"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: ImageIO.framework
      - sdk: CoreVideo.framework
      - sdk: CoreText.framework
      - sdk: Accelerate.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.app
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Aurora-Bridging-Header.h
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../../krkrlib"
          - "$(SRCROOT)/../../krkrlib/third_party/krkr/bridge/engine_api/include"
          - "$(SRCROOT)/../../krkrlib/include"
          - "$(SRCROOT)/../../krkrlib/include"
          - "$(SRCROOT)/../../onslib/include/aurora-ons"
          - "$(SRCROOT)/../../onslib/include"
          - "$(SRCROOT)/../../onslib/include/SDL"
          - "$(SRCROOT)/../../SDK/AuroraRuntimeAPI/include"
          - "$(SRCROOT)/../../SDK/AuroraModuleSDK/include"
          - "$(SRCROOT)/../../SDK/AuroraStorageAPI/include"
          - "$(SRCROOT)/../../SDK/AuroraDiagnosticsAPI/include"
          - "$(SRCROOT)/../../SDK/AuroraLibrary/include"
          - "$(SRCROOT)/../../SDK/AuroraDisplayAPI/include"
          - "$(SRCROOT)/../../SDK/AuroraInputAPI/include"
          - "$(SRCROOT)/Sources"
        OTHER_LDFLAGS:
          - "-lc++"
          - "-laurora_onscripter"
          - "-lSDL-1.2"
          - "-lSDL2"
          - "-lSDLmain"
          - "-lSDL_image"
          - "-lSDL_ttf"
          - "-lSDL_mixer"
          - "-lpng"
          - "-ljpeg"
          - "-lfreetype"
          - "-logg"
          - "-lvorbis"
          - "-lvorbisfile"
          - "-lkrkrell"
          - "-lsqlite3"
          - "-lresolv"
          - "-lbz2"
          - "-lz"
          - "-liconv"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../../krkrlib"
          - "$(SRCROOT)/../../onslib/lib"
          - "$(SRCROOT)/../../onslib/prefix/lib"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "AURORA_WITH_ONSCRIPTER=1"
          - "AURORA_WITH_KRKR=1"
